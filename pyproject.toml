[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starter"]

[project]
name = "starter"
version = "0.1.0"
description = "A minimal Python starter project using uv and Make."
requires-python = ">=3.12"
dependencies = [
    "paramiko>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[project.scripts]
int-to-hex = "starter.main:int_to_hex_cli"
hex-to-int = "starter.main:hex_to_int_cli"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "UP",
    "B",
    "S",
    "SIM",
    "PTH",
    "RUF",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["starter"]

[tool.coverage.report]
show_missing = true
skip_empty = true

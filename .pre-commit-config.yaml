repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff (lint)
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: uv run mypy src/starter
        language: system
        pass_filenames: false
        types: [python]

      - id: check-toml
        name: check toml
        entry: uv run python -c "import sys, tomllib, pathlib; [tomllib.loads(pathlib.Path(f).read_text()) for f in sys.argv[1:]]"
        language: system
        types: [toml]

      - id: debug-statements
        name: debug statements
        entry: uv run ruff check --select T10
        language: system
        types: [python]
